<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Просмотр 3D корпуса ПК</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #app { display: flex; width: 100%; height: 100%; }
    #canvas-container { flex: 1; position: relative; }
    #canvas-container canvas { display: block; width: 100%; height: 100%; }
    #panel {
      width: 420px; min-width: 420px; background: #1e1e2e; color: #cdd6f4;
      display: flex; flex-direction: column; border-left: 1px solid #313244;
    }
    #panel-header {
      padding: 12px 16px; font-weight: 600; font-size: 14px;
      background: #181825; border-bottom: 1px solid #313244;
      display: flex; justify-content: space-between; align-items: center;
    }
    #editor-wrap { flex: 1; position: relative; overflow: hidden; background: #1e1e2e; }
    #hl-layer, #dsl-editor {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; padding: 12px 16px; margin: 0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px; line-height: 1.6; tab-size: 2; letter-spacing: normal;
      white-space: pre; overflow: auto;
    }
    #hl-layer { pointer-events: none; z-index: 0; color: #cdd6f4; }
    #hl-layer .c { color: #7a8194; font-style: italic; }   /* комментарии */
    #hl-layer .n { color: #fab387; }                        /* числа */
    #hl-layer .k { color: #cba6f7; font-weight: 600; }      /* ключевые слова */
    #hl-layer .p { color: #89b4fa; }                        /* имена параметров */
    #hl-layer .f { color: #a6e3a1; }                        /* компоненты */
    #hl-layer .o { color: #9399b2; }                        /* знаки (){}= */
    #hl-layer .e { color: #f38ba8; text-decoration: underline; } /* неизвестные символы */
    #dsl-editor {
      background: transparent; color: transparent; caret-color: #cdd6f4;
      resize: none; outline: none; z-index: 1;
    }
    #dsl-editor::selection { background: rgba(88, 91, 112, 0.55); }
    #panel-footer {
      padding: 8px 16px; background: #181825; border-top: 1px solid #313244;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .btn {
      padding: 6px 14px; background: #89b4fa; color: #1e1e2e; border: none;
      border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .btn:hover { background: #74c7ec; }
    .btn-secondary { background: #585b70; color: #cdd6f4; }
    .btn-secondary:hover { background: #6c7086; }
    #error-box {
      padding: 10px 16px; background: #f38ba8; color: #1e1e2e; font-size: 12px;
      display: none; font-family: monospace; white-space: pre-wrap;
    }
    #hint {
      position: absolute; top: 10px; left: 10px; background: rgba(30,30,46,0.8);
      color: #cdd6f4; padding: 8px 12px; border-radius: 6px; font-size: 12px;
      pointer-events: none; line-height: 1.5;
    }
    #report-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    #report-overlay.hidden { display: none; }
    .modal {
      width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 80px);
      background: #1e1e2e; border: 1px solid #313244; border-radius: 8px;
      display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 12px 16px; font-weight: 600; font-size: 14px; color: #cdd6f4;
      background: #181825; border-bottom: 1px solid #313244; border-radius: 8px 8px 0 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header button {
      background: none; border: none; color: #cdd6f4; font-size: 20px; cursor: pointer; line-height: 1;
    }
    #report-text {
      flex: 1; overflow: auto; padding: 16px; margin: 0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px;
      color: #cdd6f4; white-space: pre; line-height: 1.6;
    }
    .modal-footer {
      padding: 10px 16px; background: #181825; border-top: 1px solid #313244;
      border-radius: 0 0 8px 8px; display: flex; gap: 8px; justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <div id="hint">
        ЛКМ — вращение &nbsp;|&nbsp; Колесо — масштаб &nbsp;|&nbsp; Ctrl+ЛКМ — панорама
      </div>
    </div>
    <div id="panel">
      <div id="panel-header">
        <span>Конфигурация (DSL)</span>
        <span style="font-size:11px;color:#6c7086;">Ctrl+Enter — применить</span>
      </div>
      <div id="editor-wrap">
        <pre id="hl-layer" aria-hidden="true"><code></code></pre>
        <textarea id="dsl-editor" wrap="off" spellcheck="false"></textarea>
      </div>
      <div id="error-box"></div>
      <div id="panel-footer">
        <button class="btn" id="btn-apply">Применить</button>
        <button class="btn btn-secondary" id="btn-reset-frame">Сброс</button>
        <button class="btn btn-secondary" id="btn-report">Отчёт по материалам</button>
      </div>
    </div>
  </div>

  <div id="report-overlay" class="hidden">
    <div class="modal">
      <div class="modal-header">
        <span>Спецификация профиля (материалы)</span>
        <button id="btn-close-report" title="Закрыть">×</button>
      </div>
      <pre id="report-text"></pre>
      <div class="modal-footer">
        <a class="btn btn-secondary" id="btn-download-report" download="profile_report.txt">Скачать .txt</a>
        <button class="btn" id="btn-close-report-2">Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
